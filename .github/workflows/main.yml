name: Build Box64 for Android (MiceWine)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: r26b
      NDK_ZIP: android-ndk-r26b-linux.zip
      NDK_DIR: android-ndk-r26b

    steps:
    # -------------------------
    # 1. Checkout do repositório
    # -------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # -------------------------
    # 2. Instalar dependências
    # -------------------------
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git cmake ninja-build p7zip-full unzip wget python3 \
          qemu-user-static proot

    # ===========================================================
    # ETAPA 1: PREPARAR AMBIENTE "DOKED" (TERMUX-DOCKER) PRIMEIRO
    # ===========================================================
    - name: Download and prepare DO KED (Termux Docker environment)
      run: |
        echo "=== CLONANDO AMBIENTE DOKED (TERMUX-DOCKER) ==="

        if [ ! -d termux-docker ]; then
          git clone https://github.com/termux/termux-docker.git
        fi

        mkdir -p box64/local_system/arm

        if [ -d termux-docker/system/arm ]; then
          cp -r termux-docker/system/arm/* box64/local_system/arm/
        else
          echo "AVISO: termux-docker/system/arm nao encontrado!"
        fi

    # ===========================================================
    # ETAPA 2: CACHE + DOWNLOAD DO ANDROID NDK
    # ===========================================================
    - name: Cache Android NDK
      id: cache-ndk
      uses: actions/cache@v4
      with:
        path: ${{ runner.workspace }}/ndk
        key: ndk-${{ env.NDK_VERSION }}

    - name: Download Android NDK
      if: steps.cache-ndk.outputs.cache-hit != 'true'
      run: |
        mkdir -p ${{ runner.workspace }}/ndk
        cd ${{ runner.workspace }}/ndk
        wget https://dl.google.com/android/repository/${NDK_ZIP}
        unzip -q ${NDK_ZIP}
        rm ${NDK_ZIP}

    - name: Set NDK path
      run: |
        echo "NDK_PATH=${{ runner.workspace }}/ndk/${NDK_DIR}" >> $GITHUB_ENV

    # ===========================================================
    # ETAPA 3: COMPILAR BOX64
    # ===========================================================
    - name: Build Box64
      run: |
        cd box64
        rm -rf build
        mkdir build && cd build

        TOOLCHAIN="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin"

        cmake .. -G Ninja \
          -DCMAKE_C_COMPILER="${TOOLCHAIN}/aarch64-linux-android31-clang" \
          -DANDROID=1 \
          -DARM_DYNAREC=1 \
          -DBAD_SIGNAL=1 \
          -DCMAKE_BUILD_TYPE=Release \
          -DHAVE_BACKTRACE:BOOL=OFF \
          -DCI=OFF

        ninja

    # ===========================================================
    # ETAPA 4: EMPACOTAR O .RAT
    # ===========================================================
    - name: Package .rat
      run: |
        cd box64

        MAJ=$(grep BOX64_MAJOR src/box64version.h | awk '{print $3}')
        MIN=$(grep BOX64_MINOR src/box64version.h | awk '{print $3}')
        REV=$(grep BOX64_REVISION src/box64version.h | awk '{print $3}')
        VER="${MAJ}.${MIN}.${REV}"

        COMMIT=$(git rev-parse --short HEAD)
        ARTIFACT="box64-MiceWine-Release.rat"

        mkdir -p build/files/usr/bin

        if [ -f build/box64 ]; then
          cp build/box64 build/files/usr/bin/
        elif [ -f build/box64.exe ]; then
          cp build/box64.exe build/files/usr/bin/
        else
          echo "ERRO: binario box64 nao encontrado!"
          exit 1
        fi

        cat <<EOF > build/pkg-header
name=Box64 (CI Build)
category=Box64
version=${VER}-${COMMIT}
architecture=aarch64
vkDriverLib=
EOF

        cd build
        7z a -tzip -mx=5 "../${ARTIFACT}" files pkg-header

        echo "ARTIFACT_PATH=box64/${ARTIFACT}" >> $GITHUB_ENV

    # ===========================================================
    # ETAPA 5: UPLOAD COMO ARTEFATO
    # ===========================================================
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: box64-MiceWine
        path: ${{ env.ARTIFACT_PATH }}

    # ===========================================================
    # ETAPA 6: UPLOAD AUTOMÁTICO PARA RELEASE
    # ===========================================================
    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ env.ARTIFACT_PATH }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
